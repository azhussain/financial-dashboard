spring.application.name=financial-dashboard-backend
server.port=${PORT:8080}

# Browsers attach Origin to fetch POSTs (e.g. /api/agent/chat); rejections are
# 403s which CloudFront's SPA error mapping turns into index.html — so the
# CloudFront domain must be listed here in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# AI agent (LangChain4j / OpenAI). Feature is disabled when no key is set.
agent.openai.api-key=${OPENAI_API_KEY:}
agent.openai.model=gpt-4o-mini

# Agent mesh (Stage 1): gateway auth + audit store.
# agent.gateway.api-key protects /api/agent/** — unset = pass-through (dev).
agent.gateway.api-key=${AGENT_API_KEY:}

# Optional MCP tool servers for the Virtual Agent. Comma-separated entries:
#   name|http|https://host/mcp            streamable-HTTP transport
#   name|stdio|command arg1 arg2          spawn a local MCP process
# Example: MCP_SERVERS="edgar|stdio|uvx --from edgartools edgar-mcp"
# Unset = stock tools only; a server that fails to start is skipped.
agent.mcp.servers=${MCP_SERVERS:}
# audit.store: inmemory (default) | redis (needs SPRING_DATA_REDIS_HOST).
audit.store=${AUDIT_STORE:inmemory}